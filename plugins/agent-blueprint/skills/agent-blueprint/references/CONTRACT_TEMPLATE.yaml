# Illustrative template. Populate only material fields; use an existing APC contract instead
# of duplicating one. A single Markdown scoped blueprint is enough for a small project.
contract:
  id: CONTRACT-AREA-001
  kind: capability  # capability | interface | flow | screen | data | integration
  responsibility: "[one bounded semantic responsibility]"
  canonical_owner: SYS-EXAMPLE  # actual runtime responsibility owner, NOT document
  version: 1
  authority_ids: []

intent:
  outcome: "[what a user/consumer must observe]"
  scenarios:  # expand with named steps/expected outcomes only when material
    - "[trigger -> observable result]"
  non_goals: []

boundary:
  provides:
    - name: "[operation/event/query]"
      semantics: command  # command | query | event
      input: "[schema reference or literal type]"
      output: "[schema reference or literal type]"
  consumes: []       # public contract IDs, not foreign implementation internals
  owns_state: []
  reads_state: []
  forbidden_writes: []

behavior:
  preconditions: []
  postconditions: []
  invariants: []
  failure_cases: []  # error condition -> observable response/recovery
  lifecycle: []

verification:
  acceptance_ids: []
  reference_ids: []  # design examples/protocol schemas/recordings where material
  evidence_ids: []   # evidence may be pending; never assert PASS from template

# Optional if material: UI/layout, example request/response + schema/field mapping,
# state machine, concurrency/order/fencing, auth/security, idempotency/retry,
# persistence, version/compatibility/migration, performance limits, deployment/rollback,
# source/revision-scoped evidence, target host/owner mapping.
